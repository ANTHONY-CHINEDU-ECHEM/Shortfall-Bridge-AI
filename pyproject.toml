[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shortfall_bridge"
version = "2.0.0"
description = "Shortfall Bridge AI: drug shortage therapeutic substitution engine grounded in FDA labelling, Orange Book equivalence and RxNorm classes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "tenacity>=8.2",
  "lxml>=5.1",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "typer>=0.12",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pgvector>=0.2.5",
  "prometheus-client>=0.20",
  "orjson>=3.10",
]

[project.optional-dependencies]
ml = [
  "sentence-transformers>=2.7",
  "torch>=2.2",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
shortfall = "shortfall_bridge.cli:app"

[tool.setuptools.packages.find]
include = ["shortfall_bridge*"]

[tool.setuptools.package-data]
shortfall_bridge = ["engine/data/*.yaml", "store/*.sql", "evaluation/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that require a live PostgreSQL with pgvector (set SFB_DATABASE_URL)",
]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF005", "RUF007"]  # B008: FastAPI Depends idiom; RUF001: intentional unicode in regexes

[tool.mypy]
python_version = "3.11"
strict_optional = true
ignore_missing_imports = true
